ont-weight:500}\n.chart{position:relative}\n.chart svg{width:100%;height:auto;display:block}\n.chart text{fill:var(--ink2);font:11px var(--sans)}\n.chart .lbl{font-weight:600}\n.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:6px 9px;font-size:.8rem;box-shadow:0 2px 8px rgba(0,0,0,.15);white-space:nowrap;z-index:2}\n.prog{height:6px;background:var(--line2);border-radius:3px;overflow:hidden}\n.prog i{display:block;height:100%;background:var(--accent);width:0}\n.eq{font-family:var(--mono);font-size:.85rem;background:var(--chip);padding:8px 12px;border-radius:4px;overflow-x:auto;white-space:pre}\n.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}\n\n.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}\n.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:.88rem;cursor:pointer;background:var(--bg);color:var(--ink2);user-select:none}\n.chip:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}\n.chip input{position:absolute;opacity:0;pointer-events:none}\n.chip:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}\n.pctbox{position:relative;display:inline-block}\n.pctbox input{width:96px;padding-right:22px}\n.pctbox span{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:.85rem;pointer-events:none}\n.total{display:inline-flex;align-items:center;gap:8px;font-weight:600;padding:4px 12px;border-radius:99px;font-size:.88rem;width:max-content}\n.total.ok{background:var(--good-bg);color:var(--good)}\n.total.bad{background:var(--bad-bg);color:var(--bad)}\n.hint{font-size:.85rem;color:var(--ink2)}\n#wTable th,#wTable td{text-align:center}\n#tDecision th,#tDecision td{text-align:center}\n#tDecision th:first-child,#tDecision td:first-child{text-align:left}\n#tDecision tr dby=\"h2\">\n    \u003ch2 id=\"h2\">2. Population shares\u003c/h2>\n    \u003cp class=\"hint\">Share of working time in each condition, from schedules or records.\u003c/p>\n    \u003cdiv class=\"tw\">\u003ctable id=\"wTable\">\u003c/table>\u003c/div>\n    \u003cdiv class=\"line\">\u003cspan id=\"wTotal\" class=\"total ok\">\u003c/span>\u003cbutton id=\"btnEqual\" type=\"button\">Equal shares\u003c/button>\u003c/div>\n    \u003cdiv class=\"line\" style=\"margin-top:4px\">\u003cbutton id=\"btnRun\" class=\"primary\" type=\"button\">Run analysis\u003c/button>\u003cspan id=\"runNote\" class=\"hint\">\u003c/span>\u003c/div>\n    \u003cdiv class=\"prog\" id=\"prog\" hidden>\u003ci>\u003c/i>\u003c/div>\n    \u003cdiv id=\"runMsgs\" class=\"msgs\" aria-live=\"polite\">\u003c/div>\n  \u003c/section>\n\n  \u003cdiv id=\"results\" style=\"display:flex;flex-direction:column;gap:20px\" hidden>\n    \u003csection class=\"card\" aria-labelledby=\"h3r\">\n      \u003ch2 id=\"h3r\">Result\u003c/h2>\n      \u003cdiv id=\"cards\" class=\"cards2\">\u003c/div>\n      \u003cdiv id=\"resMsgs\" class=\"msgs\">\u003c/div>\n      \u003cdiv>\n        \u003cdiv id=\"legend\" class=\"hint\" style=\"display:flex;gap:16px;flex-wrap:wrap;margin-bottom:4px\">\u003c/div>\n        \u003cdiv class=\"chart\" id=\"chart\">\u003c/div>\n      \u003c/div>\n    \u003c/section>\n    \u003csection class=\"card\">\n      \u003ch2>Decision statistics\u003c/h2>\n      \u003cdiv class=\"tw\">\u003ctable id=\"tDecision\">\u003c/table>\u003c/div>\n      \u003cp class=\"hint\">UCL: upper credible limit. Red values are above the exposure standard (95th percentile) or above 5% (exceedance fraction).\u003c/p>\n    \u003c/section>\n    \u003cdiv id=\"diag\">\u003c/div>\n    \u003cdiv class=\"line\">\u003cbutton id=\"btnCopy\" type=\"button\">Copy results summary\u003c/button>\u003cspan id=\"copyNote\" class=\"hint\">\u003c/span>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cscript>\n/* Post-stratified censored lognorm .textContent = '';\n}\n\n// ----------------------------------------------------------------- results\nfunction smry(fit, key) { return PS.summarise(fit.stats[key]); }\nvar UNITS = 'mg/m\u00b3';\nfunction render() {\n  var L = S.last, u = $('units').value || 'mg/m\u00b3'; UNITS = u;\n  var ests = [{ key: 'naive', name: 'Standard', fit: L.naive, color: 'var(--s1)' }];\n  if (L.prop) ests.push({ key: 'prop', name: 'With poststratification', fit: L.prop, color: 'var(--s2)' });\n  ests.forEach(function (e) { ['gm', 'am', 'gsd', 'p95', 'exc'].forEach(function (k) { e[k] = smry(e.fit, k); }); e.pAbove = e.fit.stats.p95.reduce(function (a, v) { return a + (v > L.oel ? 1 : 0); }, 0) / e.fit.stats.p95.length; });\n  L.ests = ests;\n  $('results').hidden = false;\n  // cards\n  $('cards').innerHTML = ests.map(function (e) {\n    var above = e.p95.median > L.oel;\n    return '\u003cdiv class=\"est\">\u003cdiv>\u003cspan class=\"sw\" style=\"background:' + e.color + '\">\u003c/span>\u003cstrong>' + e.name + '\u003c/strong>\u003c/div>' +\n      '\u003cdiv class=\"lab\">95th percentile, median\u003c/div>\u003cdiv class=\"big\">' + fmt3(e.p95.median) + ' \u003cspan style=\"font-size:.9rem;font-weight:400\">' + esc(u) + '\u003c/span>\u003c/div>' +\n      '\u003cspan class=\"pill ' + (above ? 'bad' : 'good') + '\">' + (above ? 'Above exposure standard' : 'Below exposure standard') + '\u003c/span>' +\n      '\u003cdiv class=\"lab\">Exceedance fraction, median \u003cstrong class=\"mono\">' + pct(e.exc.median) + '\u003c/strong>\u003c/div>\u003c/div>';\n  }).join('');\n  var rm = [];\n  if (!L.prop) rm.push({ k: '', t: 'No conditions selected, so only the standard estimate is shown.' });\n  showMsgs('resMsgs', rm);\n  $('legend').innerHTML = ests.map(function (e) { return '\u003cspan>\u003cspan class=\"sw\" style=\"background:' + e.color + '\">\u003c/span>' + e.name + '\u003c/span>'; }).join('');\n  drawChart(ests, L.oel, u);\n  // decision table\n  function row(e, kind) {\n    var d = Text(t).catch(fallback); } catch (e) { fallback(); return Promise.resolve(); }\n}\nfunction summaryText() {\n  var L = S.last, u = UNITS, t = 'Exposure post-stratification tool: proof of concept\\nExposure standard: ' + L.oel + ' ' + u + '; results: ' + L.c.obs.length + ' (' + L.c.ncens + ' below LOQ)\\n\\n';\n  t += ['Estimator', 'P95 median', 'P95 UCL70', 'P95 UCL90', 'P95 UCL95', 'Exceedance median', 'Exc UCL70', 'Exc UCL90', 'Exc UCL95', 'GM median', 'AM median'].join('\\t') + '\\n';\n  L.ests.forEach(function (e) { t += [e.name, fmt3(e.p95.median), fmt3(e.p95.ucl70), fmt3(e.p95.ucl90), fmt3(e.p95.ucl95), pct(e.exc.median), pct(e.exc.ucl70), pct(e.exc.ucl90), pct(e.exc.ucl95), fmt3(e.gm.median), fmt3(e.am.median)].join('\\t') + '\\n'; });\n  var p = L.priors;\n  t += '\\nSettings: ' + L.chains + ' chains x ' + L.iter + ' draws, adapt_delta 0.99, seed ' + L.seed + '; alpha ~ N(' + p.aMean + ',' + p.aSd + '), effects ~ N(0,' + p.mSd + '), interactions ~ N(0,' + p.iSd + '), sigma ~ lognormal(GM ' + p.sGm + ', GSD ' + p.sGsd + ').\\nPopulation P95 is found by inverting the weighted population CDF, not from GM and GSD.\\n';\n  return t;\n}\n\n// ------------------------------------------------------------------ events\nfunction loadText(txt, weights) {\n  var t = parseTable(txt);\n  if (!t) { showMsgs('dataMsgs', [{ k: 'err', t: 'Could not read a table. Include a header row and at least one data row.' }]); $('mapping').hidden = true; $('stepWeights').hidden = true; return; }\n  if (t.rows.length > 5000) { showMsgs('dataMsgs', [{ k: 'err', t: 'Limit is 5,000 rows.' }]); return; }\n  showMsgs('dataMsgs', []);\n  $('results').hidden = true;\n  setTable(t, weights);\n}\nvar pasteTimer = null;\n$('paste').addEventListener('input', function () {\n  clearTimeout(pasteTimer);\n  pasteTimer = setTimeout(function () { var v = $('paste').value.trim(); if (v) loadText(v); }, 500);\n});\n$('file').addEventListener('change', function (ev) {\n  var f = ev.target.files[0]; if (!f) r
